name: Desktop builds and releases

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (for example v2026.11.13.1)'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Check release tag
        shell: python
        run: |
          import os
          import sys
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          if not (workspace / 'spd_version.py').is_file():
              raise SystemExit('Tagged checkout is missing spd_version.py; commit the version file before creating a release tag')
          sys.path.insert(0, str(workspace))
          from spd_version import VERSION
          if os.environ['RELEASE_TAG'] != 'v' + VERSION:
              raise SystemExit('Release tag must match v plus VERSION in the tagged spd_version.py')
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Fetch pinned Windows SMBus modules and sources
        if: runner.os == 'Windows'
        run: python packaging/fetch_windows_modules.py
      - name: Test on Linux with Tk
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -v
      - name: Test on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -v
      - name: Build native desktop runtime
        run: python packaging/build_desktop.py
      - name: Verify relocated Linux executable
        if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/verify_desktop.py --gui
      - name: Verify relocated Windows executable
        if: runner.os == 'Windows'
        run: python packaging/verify_desktop.py --gui
      - name: Package release and checksum
        run: python packaging/archive_desktop.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}-x64
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Publish native packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes
          fi
